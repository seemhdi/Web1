{% extends "store/base.html" %}
{% load static %}

{% block title %}
{{ product.name }}
{% endblock %}

{% block content %}
    <h1>{{ product.name }}</h1>
    <p><strong>قیمت:</strong> {{ product.price }} تومان</p>
    <p><strong>توضیحات:</strong> {{ product.description }}</p>

    <form action="{% url 'add_to_cart' product.id %}" method="post">
        {% csrf_token %}
        <label for="quantity">تعداد:</label>
        <input type="number" name="quantity" value="1" min="1" id="quantity">
        <button type="submit">افزودن به سبد خرید</button>
    </form>

    <br>
    <img src="{{ product.image_url }}" alt="{{ product.name }}" width="300">
{% endblock %}
