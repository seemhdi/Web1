{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}فروشگاه محصولات دیجیتال{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'store/style.css' %}">
</head>
<body>
    <header class="main-header">
        <nav>
            <a href="{% url 'home' %}"><h1>فروشگاه دیجیتال</h1></a>
            <div class="cart-summary">
                <a href="{% url 'cart_detail' %}">
                    سبد خرید:
                    <span>
                        {{ cart|length }} محصول, {{ cart.get_total_price }} تومان
                    </span>
                </a>
            </div>
        </nav>
    </header>

    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>&copy; 2024 فروشگاه محصولات دیجیتال</p>
    </footer>
</body>
</html>
